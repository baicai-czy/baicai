# ============================================
# 城际云门户网站 — 后端开发环境
# 一键启动: docker compose up -d
# 停止删除: docker compose down -v
# ============================================

services:
  # ──────────────────────────────────────
  # MySQL 8.0 数据库
  # ──────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: portal-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: portal
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3308:3306"          # 宿主机3308 → 容器3306（避开Windows自带的MySQL服务）
    volumes:
      - mysql_data:/var/lib/mysql                        # 数据持久化
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro  # 自动建表+示例数据
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ──────────────────────────────────────
  # Redis 7 — 验证码 / Token 缓存
  # ──────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: portal-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ──────────────────────────────────────
  # Node.js 后端服务
  # ──────────────────────────────────────
  backend:
    build: ./backend
    container_name: portal-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: development
      PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root123
      DB_NAME: portal
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: portal-jwt-secret-dev-2024
      JWT_EXPIRES_IN: 7d
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app                    # 热更新：改代码自动生效
      - /app/node_modules                 # 匿名卷：不覆盖容器内 node_modules

# ──────────────────────────────────────
# 命名卷（数据持久化到 Docker 管理）
# ──────────────────────────────────────
volumes:
  mysql_data:
  redis_data:
